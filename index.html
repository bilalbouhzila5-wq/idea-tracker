<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Innovation Idea Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14302f;--paper:#f5f6f2;--card:#fff;--line:#d9ded7;--amber:#f0a81c;--teal:#1b6b66;--mute:#5d6f6c;--bad:#b3392f;--r:10px}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 "Bricolage Grotesque",system-ui,sans-serif}
header{background:var(--ink);color:#fff;padding:14px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{margin:0;font-size:1.25rem;font-weight:800;flex:1}
header h1 span{color:var(--amber)}
.wrap{max-width:1000px;margin:0 auto;padding:20px;display:grid;grid-template-columns:1fr 320px;gap:24px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px}
button.pri{background:var(--amber);border-color:var(--amber);font-weight:600;color:var(--ink)}
header button{background:transparent;color:#fff;border-color:#ffffff55}
header button.pri{background:var(--amber);color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--teal);outline-offset:1px}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;margin:4px 0 12px}
label{font-weight:600;font-size:.9rem}
.bar{display:flex;gap:10px;margin-bottom:14px}.bar select{margin:0}
.idea{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;display:flex;gap:14px}
.vote{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:44px}
.vote button{padding:2px 10px;line-height:1.2}.vote button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.score{font-weight:800;font-size:1.3rem}
.idea h3{margin:0 0 4px;font-size:1.1rem}
.meta{color:var(--mute);font-size:.85rem;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{background:#e6efec;color:var(--teal);border-radius:20px;padding:1px 10px;font-size:.8rem;font-weight:600}
.st{border-radius:20px;padding:1px 10px;font-size:.8rem;font-weight:600;background:#eee}
.st.approved{background:#d9f0dc;color:#1d6b2f}.st.rejected{background:#f6dcd8;color:var(--bad)}.st.under{background:#fdecc4;color:#7a5200}
.note{font-size:.8rem;color:var(--mute);margin-top:2px}
.side{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;align-self:start}
.side h2{margin:0 0 10px;font-size:1.05rem}
.cm{border-left:3px solid var(--line);padding-left:12px;margin:10px 0}.cm .meta{margin-bottom:2px}
.err{color:var(--bad);font-size:.9rem;min-height:1.2em}
dialog{border:none;border-radius:var(--r);padding:22px;width:min(380px,92vw)}
dialog::backdrop{background:#0008}
.empty{padding:30px;text-align:center;color:var(--mute);background:var(--card);border:1px dashed var(--line);border-radius:var(--r)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;display:none}
.urow{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:.9rem}.urow select{width:auto;margin:2px 0}
</style>
</head>
<body>
<header>
  <h1>Innovation <span>Idea</span> Tracker</h1>
  <div id="auth"></div>
</header>
<div class="wrap">
  <main>
    <div class="bar">
      <select id="fcat" aria-label="Filter by category"></select>
      <select id="fsort" aria-label="Sort ideas"><option value="votes">Most voted</option><option value="new">Newest</option></select>
    </div>
    <div id="list"></div>
  </main>
  <aside>
    <div class="side" id="side"></div>
    <div class="side" id="admin" style="margin-top:16px;display:none"></div>
  </aside>
</div>

<dialog id="dlg">
  <h2 id="dtitle" style="margin-top:0"></h2>
  <div id="uwrap"><label for="uname">Username</label><input id="uname" autocomplete="username"></div>
  <label for="email">Email</label><input id="email" type="email" autocomplete="email">
  <label for="pass">Password (6+ characters)</label><input id="pass" type="password" autocomplete="current-password">
  <div class="err" id="derr"></div>
  <div style="display:flex;gap:8px;justify-content:space-between">
    <button id="dswitch" type="button"></button>
    <span><button type="button" id="dcancel">Cancel</button> <button class="pri" type="button" id="dgo"></button></span>
  </div>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
const CATS = ["Technology","Process improvement","Customer experience"];
const STATUSES = ["new","under review","approved","rejected"];
const ROLES = ["submitter","reviewer","admin"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = d => new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});

// ---- data comes from the Netlify Function (/api), stored in Netlify Blobs ----
let D = { users:[], ideas:[], votes:[], comments:[], session:null };
const user = id => D.users.find(u => u.id === id);
let token = null; try { token = localStorage.getItem("iit-token"); } catch(e) {}
async function api(path, body){
  const r = await fetch("/api/" + path, { method: body ? "POST" : "GET",
    headers:{ "Content-Type":"application/json", ...(token ? { Authorization:"Bearer " + token } : {}) },
    body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Request failed");
  return j;
}
async function refresh(){ try { D = await api("state"); } catch(e){ toast("Could not reach the server: " + e.message); } renderAll(); }
async function act(path, body){ try { await api(path, body); await refresh(); return true; } catch(e){ toast(e.message); return false; } }
let open = {}, replyTo = {}, mode = "login";
const me = () => user(D.session);
const isStaff = () => me() && ["reviewer","admin"].includes(me().role);
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2800)}

// ---- auth ----
function renderAuth(){
  const u = me();
  $("#auth").innerHTML = u
    ? `<span style="margin-right:10px">${esc(u.username)} <span class="tag">${esc(u.role)}</span></span><button id="out">Log out</button>`
    : `<button id="li">Log in</button> <button class="pri" id="su">Sign up</button>`;
  if (u) $("#out").onclick = () => { token = null; try { localStorage.removeItem("iit-token"); } catch(e) {} refresh(); };
  else { $("#li").onclick = () => showDlg("login"); $("#su").onclick = () => showDlg("signup"); }
}
function showDlg(m){
  mode = m; const s = m==="signup";
  $("#dtitle").textContent = s ? "Create your account" : "Log in";
  $("#uwrap").style.display = s ? "" : "none";
  $("#dgo").textContent = s ? "Sign up" : "Log in";
  $("#dswitch").textContent = s ? "I have an account" : "Create account";
  $("#derr").textContent = ""; $("#dlg").showModal();
}
$("#dcancel").onclick = () => $("#dlg").close();
$("#dswitch").onclick = () => showDlg(mode==="login" ? "signup" : "login");
$("#dgo").onclick = async () => {
  const email = $("#email").value.trim(), password = $("#pass").value, username = $("#uname").value.trim();
  $("#derr").textContent = "";
  try {
    const r = await api(mode==="signup" ? "signup" : "login", { email, password, username });
    token = r.token; try { localStorage.setItem("iit-token", token); } catch(e) {}
    $("#dlg").close();
    toast(r.first ? "Welcome! You are the first user, so you are the admin." : mode==="signup" ? "Welcome aboard!" : "Logged in");
    await refresh();
  } catch(e){ $("#derr").textContent = e.message; }
};

// ---- side panels ----
function renderSide(){
  const s = $("#side");
  if (!me()) { s.innerHTML = `<h2>Share an idea</h2><p>Log in or create an account to submit ideas, vote and comment.</p>`; return; }
  s.innerHTML = `<h2>Share an idea</h2>
    <label for="t">Title</label><input id="t" maxlength="120">
    <label for="d">Description</label><textarea id="d" rows="5"></textarea>
    <label for="c">Category</label>
    <select id="c">${allCats().map(c=>`<option>${esc(c)}</option>`).join("")}<option value="__new">+ New category…</option></select>
    <input id="cn" placeholder="Name your category" style="display:none">
    <div class="err" id="ierr"></div>
    <button class="pri" id="sub">Submit idea</button>`;
  $("#c").onchange = e => $("#cn").style.display = e.target.value==="__new" ? "" : "none";
  $("#sub").onclick = async () => {
    const category = $("#c").value === "__new" ? $("#cn").value.trim() : $("#c").value;
    const title = $("#t").value.trim(), description = $("#d").value.trim();
    if (!title || !description || !category) return $("#ierr").textContent = "Add a title, a description and a category.";
    if (await act("idea", { title, description, category })) toast("Idea submitted");
  };
}
function renderAdmin(){
  const a = $("#admin"), u = me();
  if (!u || u.role !== "admin") { a.style.display = "none"; return; }
  a.style.display = "";
  a.innerHTML = `<h2>Users and roles</h2>` + D.users.map(x =>
    `<div class="urow"><span>${esc(x.username)}</span>
     <select data-uid="${x.id}" aria-label="Role of ${esc(x.username)}" ${x.id===u.id?"disabled":""}>${ROLES.map(r=>`<option ${r===x.role?"selected":""}>${r}</option>`).join("")}</select></div>`).join("");
  a.onchange = e => act("role", { user_id:e.target.dataset.uid, role:e.target.value });
}
const allCats = () => [...new Set([...CATS, ...D.ideas.map(i => i.category)])];

// ---- ideas ----
const score = id => D.votes.filter(v => v.idea_id===id).reduce((a,v) => a + v.vote_type, 0);
function renderFilter(){
  const cur = $("#fcat").value || "";
  $("#fcat").innerHTML = `<option value="">All categories</option>` + allCats().map(c=>`<option ${c===cur?"selected":""}>${esc(c)}</option>`).join("");
}
$("#fcat").onchange = renderList; $("#fsort").onchange = renderList;

function renderList(){
  const f = $("#fcat").value, sort = $("#fsort").value;
  const l = D.ideas.filter(i => !f || i.category===f).map(i => ({...i, score:score(i.id)}));
  const byDate = (a,b) => new Date(b.created_at) - new Date(a.created_at);
  l.sort((a,b) => sort==="votes" ? b.score-a.score || byDate(a,b) : byDate(a,b));
  $("#list").innerHTML = l.length ? l.map(card).join("") : `<div class="empty">No ideas here yet. Be the first to share one.</div>`;
  l.forEach(i => { if (open[i.id]) drawComments(i.id); });
}
function card(i){
  const u = me(), mine = u && i.submitter_id === u.id;
  const my = u ? D.votes.find(v => v.idea_id===i.id && v.user_id===u.id)?.vote_type : 0;
  const dis = !u || mine ? "disabled" : "";
  const why = !u ? "Log in to vote" : mine ? "You can’t vote on your own idea" : "";
  const stc = i.status==="under review" ? "under" : i.status;
  const n = D.comments.filter(c => c.idea_id===i.id).length;
  return `<article class="idea" data-id="${i.id}">
    <div class="vote" title="${why}">
      <button ${dis} class="${my===1?"on":""}" data-v="1" aria-label="Upvote">▲</button>
      <span class="score">${i.score}</span>
      <button ${dis} class="${my===-1?"on":""}" data-v="-1" aria-label="Downvote">▼</button>
    </div>
    <div style="flex:1;min-width:0">
      <h3>${esc(i.title)}</h3>
      <div class="meta"><span class="tag">${esc(i.category)}</span><span class="st ${stc}">${esc(i.status)}</span>
        <span>by ${esc(user(i.submitter_id)?.username||"unknown")}${mine?" (you)":""}, ${fmt(i.created_at)}</span></div>
      <p>${esc(i.description)}</p>
      ${mine ? `<div class="note">You can’t vote on your own idea. Others can.</div>` : ""}
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <button data-act="toggle">${open[i.id]?"Hide":"Discuss"} (${n})</button>
        ${isStaff() ? `<select data-act="status" aria-label="Set status" style="width:auto;margin:0">${STATUSES.map(s=>`<option ${s===i.status?"selected":""}>${s}</option>`).join("")}</select>` : ""}
        ${mine || u?.role==="admin" ? `<button data-act="del">Delete</button>` : ""}
      </div>
      <div id="c${i.id}"></div>
    </div></article>`;
}

$("#list").addEventListener("click", async e => {
  const art = e.target.closest(".idea"), b = e.target.closest("button"); if (!art || !b) return;
  const id = art.dataset.id;
  if (b.dataset.v) return act("vote", { idea_id:id, type:+b.dataset.v });
  if (b.dataset.act==="toggle") { open[id] = !open[id]; return renderList(); }
  if (b.dataset.act==="del" && confirm("Delete this idea?")) return act("delete", { kind:"idea", id });
  if (b.dataset.cmd==="reply") { replyTo[id] = b.dataset.cid; return drawComments(id); }
  if (b.dataset.cmd==="rm") return act("delete", { kind:"comment", id:b.dataset.cid, idea_id:id });
  if (b.dataset.cmd==="send") {
    const content = art.querySelector(".cin").value.trim(); if (!content) return;
    if (await act("comment", { idea_id:id, parent_id:replyTo[id] || null, content })) replyTo[id] = null;
  }
});
$("#list").addEventListener("change", e => {
  if (e.target.dataset.act === "status") act("status", { idea_id:e.target.closest(".idea").dataset.id, status:e.target.value });
});

function drawComments(id){
  const box = $("#c"+id); if (!box) return;
  const u = me(), all = D.comments.filter(c => c.idea_id===id).sort((a,b) => new Date(a.created_at)-new Date(b.created_at));
  const kids = p => all.filter(c => (c.parent_id||null)===p);
  const one = c => `<div class="cm"><div class="meta"><strong>${esc(user(c.user_id)?.username||"unknown")}</strong><span>${fmt(c.created_at)}</span>
      ${u ? `<button data-cmd="reply" data-cid="${c.id}" style="padding:0 8px">Reply</button>` : ""}
      ${u && (c.user_id===u.id || u.role==="admin") ? `<button data-cmd="rm" data-cid="${c.id}" style="padding:0 8px">Delete</button>` : ""}</div>
      <div>${esc(c.content)}</div>${kids(c.id).map(one).join("")}</div>`;
  const target = replyTo[id] ? all.find(c => c.id===replyTo[id]) : null;
  box.innerHTML = `<div style="margin-top:12px">${kids(null).map(one).join("") || '<div class="note">No comments yet.</div>'}
    ${u ? `<div style="margin-top:10px">${target ? `<div class="note">Replying to ${esc(user(target.user_id)?.username)}</div>` : ""}
      <input class="cin" placeholder="Write constructive feedback…" aria-label="Comment"><button class="pri" data-cmd="send">Post comment</button></div>`
    : `<div class="note">Log in to comment.</div>`}</div>`;
}

function renderAll(){ renderAuth(); renderSide(); renderAdmin(); renderFilter(); renderList(); }
refresh();
</script>
</body>
</html>
